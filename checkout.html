<!doctype html>
<html lang="bg">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Поръчка | Хартиени Самолети</title>
  <meta name="description" content="Хартиени Самолети: авторски текстилни торби, картички и книгоразделители с хумористични надписи. Тестов сайт.">
  <meta name="theme-color" content="#e6d9c8">
  <link rel="icon" type="image/png" href="images/icons/favicon.png">
  <link rel="apple-touch-icon" href="images/icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="checkout" data-title="checkout.pageTitle" data-products>
  <div id="site-header"></div>
  <main>
    <section class="section">
      <div class="container">
        <h1><span class="watercolor title-wash" data-i18n="checkout.title"></span></h1>
        <p class="notice" data-i18n="checkout.testNote"></p>
        <div id="checkout-empty" class="empty-state" hidden>
          <p data-i18n="checkout.emptyCart"></p>
          <a class="btn" href="catalog.html" data-i18n="cart.continue"></a>
        </div>
        <div class="checkout-grid" id="checkout-grid">
          <form class="panel form" id="order-form" novalidate>
            <h2 data-i18n="checkout.contact"></h2>
            <div class="field">
              <label for="f-name"><span data-i18n="checkout.name"></span> <span class="req">*</span></label>
              <input id="f-name" name="name" autocomplete="name" required maxlength="100">
            </div>
            <div class="field">
              <label for="f-phone"><span data-i18n="checkout.phone"></span> <span class="req">*</span></label>
              <input id="f-phone" name="phone" type="tel" autocomplete="tel" inputmode="tel" required maxlength="30" placeholder="08XX XXX XXX">
            </div>
            <div class="field">
              <label for="f-email"><span data-i18n="checkout.email"></span> <span class="req">*</span></label>
              <input id="f-email" name="email" type="email" autocomplete="email" required maxlength="120">
            </div>

            <h2 data-i18n="checkout.delivery"></h2>
            <fieldset class="field">
              <legend data-i18n="checkout.courier"></legend>
              <div class="choice-group">
                <label class="choice"><input type="radio" name="courier" value="Еконт" checked> <span data-i18n="checkout.econt"></span></label>
                <label class="choice"><input type="radio" name="courier" value="Спиди"> <span data-i18n="checkout.speedy"></span></label>
              </div>
            </fieldset>
            <fieldset class="field">
              <legend data-i18n="checkout.to"></legend>
              <div class="choice-group">
                <label class="choice"><input type="radio" name="deliveryTo" value="office" checked> <span data-i18n="checkout.toOffice"></span></label>
                <label class="choice"><input type="radio" name="deliveryTo" value="address"> <span data-i18n="checkout.toAddress"></span></label>
              </div>
            </fieldset>
            <div class="field">
              <label for="f-city"><span data-i18n="checkout.city"></span> <span class="req">*</span></label>
              <input id="f-city" name="city" list="city-list" autocomplete="off" required maxlength="80" data-i18n-placeholder="checkout.cityPlaceholder">
              <datalist id="city-list"></datalist>
              <small class="muted" data-i18n="checkout.cityHint"></small>
            </div>
            <div class="field">
              <label for="f-place"><span id="place-label" data-i18n="checkout.office"></span> <span class="req">*</span></label>
              <input id="f-place" name="place" required maxlength="200">
            </div>
            <div class="field">
              <label for="f-note" data-i18n="checkout.note"></label>
              <textarea id="f-note" name="note" maxlength="1000"></textarea>
            </div>

            <h2 data-i18n="checkout.payment"></h2>
            <label class="choice"><input type="radio" name="payment" value="cod" checked> <span data-i18n="checkout.cod"></span></label>

            <!-- Капан за спам ботове: хората не виждат това поле -->
            <input type="checkbox" name="botcheck" class="visually-hidden" tabindex="-1" autocomplete="off">

            <div id="form-msg" class="notice error" role="alert" hidden></div>
            <button class="btn btn-block" type="submit" id="submit-btn" data-i18n="checkout.submit"></button>
          </form>

          <aside class="panel">
            <h2 data-i18n="checkout.summary"></h2>
            <div id="summary"></div>
          </aside>
        </div>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/cities.js"></script>
  <script src="js/checkout.js"></script>
</body>
</html>
